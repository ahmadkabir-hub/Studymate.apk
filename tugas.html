<main class="content-area">
   <h1>Manajemen Tugas</h1>
    <p>Kelola dan pantau tugas kuliahmu dengan mudah</p>

    <div class="form-tugas">
    <h2>Tambah Tugas</h2>

    <form id="form-tambah-tugas">

        <div class="form-group">
            <label for="input-tanggal">Tanggal</label>
            <input type="date" id="input-tanggal" name="tanggal" required>
        </div>

        <div class="form-group">
            <label for="input-hari">Hari</label>
            <input type="text" id="input-hari" name="hari"
                   placeholder="Contoh: Senin" required>
        </div>

        <div class="form-group">
            <label for="input-pemberi">Pemberi Tugas</label>
            <input type="text" id="input-pemberi" name="pemberi"
                   placeholder="Contoh: Dosen" required>
        </div>

        <div class="form-group">
            <label for="input-tugas">Nama / Deskripsi Tugas</label>
            <textarea id="input-tugas" name="tugas"
                      placeholder="Masukkan nama atau deskripsi tugas"
                      required></textarea>
        </div>

        <div class="form-group">
            <label for="input-deadline">Deadline</label>
            <input type="date" id="input-deadline" name="deadline" required>
        </div>

        <button type="submit" id="btn-tambah-tugas">
            + Tambah Tugas
        </button>

    </form>
</div>

<!-- Daftar tugas -->
<div class="daftar-tugas">
    <h2>Daftar Tugas</h2>

    <div id="list-tugas">
        <!-- Data tugas akan dibuat otomatis oleh JavaScript -->
    </div>
</div>
